<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/lobby.css" />
  <link rel="stylesheet" href="/css/chat.css" />
</head>
<body>

  <!-- ═══════════════════════════ LOBBY ═══════════════════════════ -->
  <div id="lobby">
    <div class="lobby-card">
      <div class="logo">Live<span>Chat</span></div>
      <p class="lobby-subtitle">chat en tiempo real · sin registro</p>

      <div class="field-group">
        <label for="user-name">Tu nombre</label>
        <input type="text" id="user-name" placeholder="Ej: Ana López" maxlength="24" />
      </div>

      <div class="field-group">
        <label>Color</label>
        <div class="color-row" id="color-picker"></div>
      </div>

      <button class="btn btn-primary" id="btn-create">✦ Crear sala nueva</button>

      <div class="divider">o únete a una existente</div>

      <div class="field-group">
        <label for="room-code">Código de sala</label>
        <input type="text" id="room-code" placeholder="Ej: abc123" maxlength="12" />
      </div>
      <button class="btn btn-secondary" id="btn-join">Unirse a sala →</button>
    </div>
  </div>

  <!-- ═══════════════════════════ CHAT ════════════════════════════ -->
  <div id="chat-view">

    <header class="chat-header">
      <div class="room-info">
        <span class="room-name">💬 LiveChat</span>
        <span class="room-id-display" id="display-room-id"></span>
      </div>
      <div class="header-right">
        <div class="online-pill">
          <span class="dot-green"></span>
          <span id="online-count">1</span> en línea
        </div>
        <button class="share-btn" id="btn-share">🔗 Compartir</button>
      </div>
    </header>

    <main id="messages"></main>

    <div id="typing-indicator"></div>

    <!-- File preview bar -->
    <div id="file-preview-bar" class="hidden">
      <div id="file-preview-inner"></div>
      <button id="btn-cancel-file" title="Cancelar">✕</button>
    </div>

    <footer class="input-area">
      <!-- Hidden file input -->
      <input type="file" id="file-input" accept="image/*,video/*,audio/*,.pdf,.zip,.txt" multiple />

      <button class="attach-btn" id="btn-attach" title="Adjuntar archivo">
        <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 0 0 5 0V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
      </button>

      <textarea id="msg-input" placeholder="Escribe un mensaje…" rows="1"></textarea>

      <button id="send-btn" title="Enviar">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </footer>

  </div>

  <!-- Toast notification -->
  <div id="toast"></div>

  <!-- Lightbox -->
  <div id="lightbox" class="hidden">
    <button id="lightbox-close">✕</button>
    <img id="lightbox-img" src="" alt="preview" />
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
